# dsh-encrypt Stent bundle.
#
# The official credentials-local row remains enabled and continues to own the
# provider lifecycle, YAML parser, environment precedence, watcher and writes.
# This row only activates the sidecar controller plus the targeted Stent
# transforms. It is disabled on plain dsh and enabled by stent-dsh.
#
# The encrypted form is:
#   .credentials.yaml          comment-only shadow marker
#   .credentials.encrypt.yaml  encrypted credential document
- insert:
    - id: dsh-encrypt-fabric
      name: 'dsh-encrypt'
      disabled: true
      config:
        allowEnvFallback: true
        trustedHosts: []
        stent:
          patches:
            - id: dsh-encrypt/credentials-resolve
              required: true
              target:
                module: '@deepseek-ai/dsh-credentials-local'
                versionRange: '>=0.0.1-0 <0.2.0'
                filePaths: ['src/index.ts', 'lib/index.js']
                functionQuery: { methodName: 'resolve', kind: 'Async' }
              operation: after
            - id: dsh-encrypt/credentials-describe
              required: true
              target:
                module: '@deepseek-ai/dsh-credentials-local'
                versionRange: '>=0.0.1-0 <0.2.0'
                filePaths: ['src/index.ts', 'lib/index.js']
                functionQuery: { methodName: 'describe', kind: 'Async' }
              operation: after
            - id: dsh-encrypt/credentials-set
              required: true
              target:
                module: '@deepseek-ai/dsh-credentials-local'
                versionRange: '>=0.0.1-0 <0.2.0'
                filePaths: ['src/index.ts', 'lib/index.js']
                functionQuery: { methodName: 'set', kind: 'Async' }
              operation: around
            - id: dsh-encrypt/credentials-unset
              required: true
              target:
                module: '@deepseek-ai/dsh-credentials-local'
                versionRange: '>=0.0.1-0 <0.2.0'
                filePaths: ['src/index.ts', 'lib/index.js']
                functionQuery: { methodName: 'unset', kind: 'Async' }
              operation: around
            - id: dsh-encrypt/webserver-http-register
              required: false
              target:
                module: '@deepseek-ai/dsh-host-webserver'
                versionRange: '>=0.0.1-0 <0.2.0'
                filePaths: ['src/index.ts', 'lib/index.js']
                functionQuery: { methodName: 'register', kind: 'Sync' }
              operation: before
            - id: dsh-encrypt/webserver-upgrade-register
              required: false
              target:
                module: '@deepseek-ai/dsh-host-webserver'
                versionRange: '>=0.0.1-0 <0.2.0'
                filePaths: ['src/index.ts', 'lib/index.js']
                functionQuery: { methodName: 'registerUpgrade', kind: 'Sync' }
              operation: before
